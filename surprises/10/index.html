<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Night Sky Constellation Heart</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    #sky-canvas {
      width: 100%;
      height: 260px;
      background: #090A0F;
      border-radius: 16px;
      margin: 15px 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="badge">Surprise #10</div>
      <h1 class="title">Starlight Heart</h1>
      <p class="subtitle">Written in the stars, created just for Justine.</p>

      <canvas id="sky-canvas"></canvas>

      <p style="font-size: 0.9rem; color: var(--text-muted);">
        Every twinkling star forms a constellation of love in the night sky. ✨
      </p>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('sky-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    const stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        size: Math.random() * 2 + 1,
        alpha: Math.random()
      });
    }

    let t = 0;
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw background stars
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + 0.7 * Math.sin(t * 2 + s.alpha * 10)})`;
        ctx.beginPath();
        ctx.arc(s.x * canvas.width, s.y * canvas.height, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Constellation Heart Points
      const heartPoints = [];
      const numPoints = 16;
      const baseSize = canvas.width * 0.012;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(angle), 3);
        const y = -(13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle));
        heartPoints.push({
          x: cx + x * baseSize,
          y: cy + y * baseSize
        });
      }

      // Draw constellation lines
      ctx.strokeStyle = 'rgba(238, 174, 202, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      heartPoints.forEach((p, idx) => {
        if (idx === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.stroke();

      // Draw heart stars
      heartPoints.forEach(p => {
        ctx.fillStyle = '#FFE4E6';
        ctx.shadowColor = '#FF758C';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      t += 0.02;
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
