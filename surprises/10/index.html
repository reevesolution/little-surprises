<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Love-O-Meter · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#ffe3f0,#e9e5ff);}.card{max-width:440px;overflow:visible}.scene{margin:22px auto;padding:18px;border-radius:22px;min-height:160px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:#fff;padding:13px 19px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:6px}.action:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #643b8b;outline-offset:3px}.message{margin:18px 0;font-size:1.13rem;line-height:1.55;font-weight:600;min-height:54px}.hint{font-size:.84rem;color:#6c6470}.hidden{display:none!important}.arcade{background:#342046;border:8px solid #e5b753;box-shadow:inset 0 0 0 5px #784970;color:#fff}.display{font:900 2.5rem monospace;color:#ffda71;text-shadow:0 0 14px #ff76a0}.meter{height:26px;border:2px solid white;border-radius:14px;overflow:hidden;background:#130f1d;margin:18px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff7bb0,#ffd95d);transition:width 2s}.alarm{color:#ffe57a;font-weight:900;animation:flash .4s infinite alternate}@keyframes flash{to{opacity:.25}}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #10</div><h1 class="title">Love-O-Meter</h1><p class="subtitle">An extremely scientific machine that measures how much I love you.</p><div class="scene arcade"><p>HUSBAND LABORATORIES</p><div class="display" id="display">000%</div><div class="meter"><div class="fill" id="fill"></div></div><p id="alarm" aria-live="polite">READY FOR TESTING</p></div><button class="action" id="start">Measure our love ❤️</button><p class="message" id="message" role="status" aria-live="polite"></p></section></main><script>let timer;document.querySelector('#start').addEventListener('click',()=>{clearInterval(timer);let n=0;const display=document.querySelector('#display'),fill=document.querySelector('#fill'),alarm=document.querySelector('#alarm');alarm.classList.remove('alarm');alarm.textContent='SCANNING…';document.querySelector('#message').textContent='';document.querySelector('#start').disabled=true;timer=setInterval(()=>{n+=7;display.textContent=String(n).padStart(3,'0')+'%';fill.style.width=Math.min(100,n)+'%';if(n>140){clearInterval(timer);display.textContent='∞%';alarm.textContent='🚨 LOVE OVERLOAD 🚨';alarm.classList.add('alarm');document.querySelector('#message').textContent='Apparently this machine cannot measure how much I love you. ❤️';document.querySelector('#start').disabled=false;try{const A=window.AudioContext||window.webkitAudioContext;if(A){const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.value=.025;o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.15);o.onended=()=>c.close()}}catch(e){}}},85)});</script></body></html>
