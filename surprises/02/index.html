<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Love Lottery · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#fff3f7,#f5ecff)}.card{max-width:440px}.stage{margin:22px 0}.action{border:0;border-radius:24px;background:#c43b71;color:white;padding:14px 22px;font-size:1rem;font-weight:700;cursor:pointer;min-height:48px}button:focus-visible{outline:3px solid #43216a;outline-offset:3px}.result{font-size:1.15rem;font-weight:650;line-height:1.6;min-height:65px;margin:18px 0}.hint{font-size:.85rem;color:#5c5361}.ticket{position:relative;border-radius:20px;background:#fff4cb;padding:24px 12px;border:3px dashed #d8a649}.scratch{touch-action:none;display:block;width:100%;height:125px;border-radius:12px;cursor:crosshair}.ticket .result{margin:0;font-size:1.25rem}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #02</div><h1 class="title">Love Lottery</h1><p class="subtitle">Every ticket is a winner. Scratch to reveal your prize!</p><div class="ticket stage"><div class="result" id="message" aria-live="polite">You bring me so much joy babe! ❤️</div><canvas class="scratch" id="scratch" width="360" height="125" aria-label="Scratch the silver coating to reveal your message"></canvas></div><button class="action" id="reveal">Reveal my prize ❤️</button><p class="hint">Rub the silver area with your finger, or use the reveal button.</p></section></main><script>const canvas=document.querySelector('#scratch'),ctx=canvas.getContext('2d');function paint(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#aaaeb9';ctx.fillRect(0,0,360,125);ctx.fillStyle='#fff';ctx.font='bold 23px sans-serif';ctx.textAlign='center';ctx.fillText('SCRATCH HERE ✨',180,70)}paint();let down=false,moves=0;function rub(e){if(!down)return;e.preventDefault();const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*125/r.height;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,26,0,Math.PI*2);ctx.fill();if(++moves>32)reveal()}function reveal(){canvas.style.visibility='hidden';document.querySelector('#message').focus?.()}canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);rub(e)});canvas.addEventListener('pointermove',rub);canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointercancel',()=>down=false);document.querySelector('#reveal').addEventListener('click',reveal);</script></body></html>
