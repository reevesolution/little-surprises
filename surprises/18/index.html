<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Love Garden · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#e7f7e2,#fff4db)}.card{max-width:440px;overflow:visible}.scene{margin:20px auto;padding:18px;border-radius:22px;min-height:180px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:white;padding:13px 20px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:5px}button:focus-visible{outline:3px solid #713ca0;outline-offset:3px}.message{font-size:1.12rem;line-height:1.55;font-weight:650;margin:18px 0;min-height:50px}.hint{font-size:.84rem;color:#68616c}.hidden{display:none!important}.garden{background:linear-gradient(#a6d6fa 0 62%,#8fbc79 62%);min-height:290px;display:grid;place-items:center}.plant{font-size:6rem;transition:transform .6s;filter:drop-shadow(0 4px 8px #425e3c55)}.plant.grown{animation:bloom 1s ease}@keyframes bloom{50%{transform:scale(1.25)}}.action{background:#548c5c}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #18</div><h1 class="title">The Love Garden</h1><p class="subtitle">Some beautiful things grow a little more every day.</p><div class="scene garden"><div class="plant" id="plant" role="img" aria-label="Seed waiting to grow">🫘</div></div><button class="action" id="grow">Plant our sunflower 🌱</button><p class="message" id="message" role="status" aria-live="polite">Every great garden starts with a little love.</p></section></main><script>const stages=[['🫘','Plant our sunflower 🌱','A little seed of love.'],['🌱','Water our seed 💧','Look, something beautiful is growing!'],['🌿','Help it grow ☀️','A little sunshine goes a long way.'],['🌻','Plant again ↻','Every day with you gives me another reason to love you. ❤️']];let stage=0;document.querySelector('#grow').addEventListener('click',()=>{stage=(stage+1)%stages.length;const [emoji,label,msg]=stages[stage];const plant=document.querySelector('#plant');plant.textContent=emoji;plant.setAttribute('aria-label',emoji==='🌻'?'Blooming sunflower':'Growing sunflower');plant.classList.remove('grown');void plant.offsetWidth;plant.classList.add('grown');document.querySelector('#grow').textContent=label;document.querySelector('#message').textContent=msg});</script></body></html>
