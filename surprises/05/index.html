<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Official Husband Report Card · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#fff3f7,#f5ecff)}.card{max-width:440px}.stage{margin:22px 0}.action{border:0;border-radius:24px;background:#c43b71;color:white;padding:14px 22px;font-size:1rem;font-weight:700;cursor:pointer;min-height:48px}button:focus-visible{outline:3px solid #43216a;outline-offset:3px}.result{font-size:1.15rem;font-weight:650;line-height:1.6;min-height:65px;margin:18px 0}.hint{font-size:.85rem;color:#5c5361}.sheet{text-align:left;background:#fffdf6;border:2px solid #b8a77f;padding:16px;border-radius:4px;box-shadow:5px 5px 0 #ded5c1}.seal{text-align:center;font-family:Georgia,serif;color:#554a38;font-size:.85rem;letter-spacing:.13em}.category{border-top:1px solid #d7cdb9;padding:12px 0}.category legend{font-weight:700;font-size:.94rem;margin-bottom:8px}.stars{display:flex;gap:3px;justify-content:space-between}.stars label{cursor:pointer;padding:5px;font-size:1.35rem}.stars input{accent-color:#b48735}.reaction{font-size:.84rem;color:#68583c;margin-top:6px;min-height:20px}.verdict{border:3px double #9a283a;padding:14px;margin-top:14px;text-align:center;font-weight:900;color:#9a283a}.disclaimer{font-family:Georgia,serif;text-align:center;margin-top:15px}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #05</div><h1 class="title">Official Husband Report Card</h1><p class="subtitle">Confidential performance review. Evaluator: Wife. Subject: Husband.</p><div class="sheet stage"><div class="seal">OFFICIAL DEPARTMENT OF HUSBAND EVALUATION</div><form id="report"><div id="categories"></div><button class="action" type="submit">Issue official verdict</button></form><div id="verdict" class="verdict" role="status" aria-live="polite" hidden></div><p class="disclaimer">Regardless of rating, husband remains under a lifetime contract to love you. ❤️</p></div></section></main><script>const names=["Quality of Husband Hugs","Ability to Find Things Right in Front of Him","Romantic Husband Skills","Listening to Wife's Stories","Overall Husband Cuteness"];const comments=[["Certified professional-grade cuddler.","Acceptable performance. Further observation recommended.","Hugging department has been placed on probation."],["An unexpectedly competent household detective.","Acceptable performance. Further observation recommended.","Search-and-rescue training urgently required."],["Dangerously charming. Proceed with caution.","Acceptable performance. Further observation recommended.","Mandatory romance retraining has been scheduled."],["Excellent listener. Deserves a gold star.","Acceptable performance. Further observation recommended.","Subject appears to have temporarily lost audio reception."],["An objectively adorable specimen.","Acceptable performance. Further observation recommended.","Needs improvement. Possibly more kisses."]];const holder=document.querySelector('#categories');names.forEach((name,i)=>{const f=document.createElement('fieldset');f.className='category';f.innerHTML='<legend>'+name+'</legend><div class="stars">'+[1,2,3,4,5].map(n=>'<label><input type="radio" name="rating'+i+'" value="'+n+'" required aria-label="'+n+' stars"> '+n+'★</label>').join('')+'</div><div class="reaction" aria-live="polite"></div>';f.addEventListener('change',e=>{const n=Number(e.target.value);f.querySelector('.reaction').textContent=comments[i][n>=4?0:n===3?1:2];document.querySelector('#verdict').hidden=true});holder.appendChild(f)});document.querySelector('#report').addEventListener('submit',e=>{e.preventDefault();const values=names.map((_,i)=>Number(document.querySelector('input[name="rating'+i+'"]:checked')?.value));if(values.some(n=>!n))return;const avg=values.reduce((a,b)=>a+b,0)/values.length;const verdict=avg>=4.5?'OUTSTANDING HUSBAND MATERIAL':avg>=3.5?'HUSBAND IN GOOD STANDING':avg>=2.5?'HUSBAND REQUIRES ADDITIONAL TRAINING':'HUSBAND PLACED ON ROMANTIC PROBATION';const el=document.querySelector('#verdict');el.textContent=verdict;el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'nearest'})});</script></body></html>
