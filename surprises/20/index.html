<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Favorite Place in the Universe · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:radial-gradient(circle,#121c4c,#050b24)}.card{max-width:440px;overflow:visible}.scene{margin:20px auto;padding:18px;border-radius:22px;min-height:180px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:white;padding:13px 20px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:5px}button:focus-visible{outline:3px solid #713ca0;outline-offset:3px}.message{font-size:1.12rem;line-height:1.55;font-weight:650;margin:18px 0;min-height:50px}.hint{font-size:.84rem;color:#68616c}.hidden{display:none!important}.card{background:#111a39;color:#fff}.title{color:#fff}.subtitle,.hint{color:#c4cde6}.universe{background:radial-gradient(circle,#203d75,#070b1e);min-height:270px;display:grid;place-items:center}.earth{font-size:7rem;animation:rotate 12s ease-in-out infinite alternate;filter:drop-shadow(0 0 28px #7abdf0)}@keyframes rotate{to{transform:rotate(25deg)}}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{background:#354b82}.choices button.seen{background:#85528b}.finale{font-size:1.2rem;color:#ffd1ea;font-weight:700}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #20</div><h1 class="title">My Favorite Place in the Universe</h1><p class="subtitle">There are billions of places in the universe. Explore the four that matter most.</p><div class="scene universe"><div class="earth" id="earth" role="img" aria-label="Miniature planet Earth">🌎</div></div><div class="choices" id="choices"></div><p class="message" id="message" role="status" aria-live="polite">Tap a discovery below.</p><div class="finale hidden" id="finale"><div style="font-size:5rem">💖</div>Of all the places in the universe, my favorite will always be wherever you are. I love you, babe. ❤️</div></section></main><script>const discoveries=[["You","Of all the people in this enormous universe, I'm so glad I found you."],["Us","My favorite adventures are the ones we share."],["Our Family","Look at the beautiful little world we've made together."],["Forever","Wherever life takes us, you're my favorite place to be."]];const seen=new Set();discoveries.forEach(([name,msg],i)=>{const b=document.createElement('button');b.className='action';b.textContent=name;b.addEventListener('click',()=>{seen.add(i);b.classList.add('seen');document.querySelector('#message').textContent=msg;if(seen.size===4){document.querySelector('#finale').classList.remove('hidden');document.querySelector('#earth').textContent='💖'}});document.querySelector('#choices').appendChild(b)});</script></body></html>
