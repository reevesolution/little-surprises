<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Put My Heart Together · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#fff0f4,#ffe6ec);}.card{max-width:440px;overflow:visible}.scene{margin:22px auto;padding:18px;border-radius:22px;min-height:160px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:#fff;padding:13px 19px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:6px}.action:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #643b8b;outline-offset:3px}.message{margin:18px 0;font-size:1.13rem;line-height:1.55;font-weight:600;min-height:54px}.hint{font-size:.84rem;color:#6c6470}.hidden{display:none!important}.pieces{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:280px;margin:0 auto}.piece{font-size:3.2rem;border:2px dashed #d28aa8;background:#fff8fa;border-radius:16px;min-height:100px;cursor:pointer;transition:transform .3s,background .3s}.piece.selected{background:#ffc4d9;transform:scale(1.05)}.whole{font-size:5rem;animation:glow 1.5s infinite alternate}@keyframes glow{to{text-shadow:0 0 35px #ff6aa0;transform:scale(1.1)}}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #06</div><h1 class="title">Put My Heart Together</h1><p class="subtitle">Four little pieces. One whole heart. Tap each piece to put it back together.</p><div class="scene"><div class="pieces" id="pieces"><button class="piece" aria-label="Heart piece one">💗</button><button class="piece" aria-label="Heart piece two">💗</button><button class="piece" aria-label="Heart piece three">💗</button><button class="piece" aria-label="Heart piece four">💗</button></div><div id="whole" class="whole hidden" role="img" aria-label="Complete glowing heart">💖</div></div><p class="message" id="message" role="status" aria-live="polite">Every piece is yours.</p><button class="action" id="reset">Start again</button></section></main><script>const pieces=[...document.querySelectorAll('.piece')];pieces.forEach(p=>p.addEventListener('click',()=>{p.classList.add('selected');p.setAttribute('aria-pressed','true');if(pieces.every(x=>x.classList.contains('selected'))){document.querySelector('#pieces').classList.add('hidden');document.querySelector('#whole').classList.remove('hidden');document.querySelector('#message').textContent='No matter how scattered life gets, my heart always belongs with you. ❤️'}}));document.querySelector('#reset').addEventListener('click',()=>{pieces.forEach(p=>{p.classList.remove('selected');p.setAttribute('aria-pressed','false')});document.querySelector('#pieces').classList.remove('hidden');document.querySelector('#whole').classList.add('hidden');document.querySelector('#message').textContent='Every piece is yours.'});</script></body></html>
