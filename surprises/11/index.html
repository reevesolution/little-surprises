<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Secret Cipher Decoder Wheel</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    .cipher-wheel {
      width: 200px;
      height: 200px;
      border: 6px solid var(--accent-gold);
      border-radius: 50%;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #FFFDF9;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.2);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .wheel-inner {
      width: 130px;
      height: 130px;
      border: 4px dashed var(--primary-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--secondary-color);
    }
    .decoded-box {
      background: #F8FAFC;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-top: 15px;
      min-height: 60px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="badge">Surprise #11</div>
      <h1 class="title">Secret Cipher Wheel</h1>
      <p class="subtitle">Spin the decoder wheel to unlock Justine's secret romantic message!</p>

      <div class="cipher-wheel" id="wheel" onclick="spinWheel()">
        <div class="wheel-inner" id="wheel-text">LOCK</div>
      </div>

      <div class="decoded-box" id="decoded-msg">
        🔒 Encrypted message: "KVUAPUL "
      </div>
    </div>
  </main>

  <script>
    let currentRotation = 0;
    let unlocked = false;

    function spinWheel() {
      currentRotation += 360 + 90;
      const wheel = document.getElementById('wheel');
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        unlocked = true;
        document.getElementById('wheel-text').textContent = 'UNLOCKED';
        document.getElementById('decoded-msg').innerHTML = '🔓 Decoded: <strong>"JUSTINE, YOU ARE MY ENTIRE WORLD!"</strong> ❤️';
      }, 600);
    }
  </script>
</body>
</html>
