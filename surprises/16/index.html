<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pop the Floating Hearts Mini-Game</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    .game-area {
      position: relative;
      width: 100%;
      height: 260px;
      background: #FFF5F7;
      border: 2px dashed #FFB6C1;
      border-radius: 16px;
      margin: 15px 0;
      overflow: hidden;
      touch-action: none;
    }
    .pop-heart {
      position: absolute;
      font-size: 2.2rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease;
    }
    .pop-heart:active {
      transform: scale(1.4);
    }
    .score-board {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="badge">Surprise #16</div>
      <h1 class="title">Heart Popper</h1>
      <p class="subtitle">Tap and pop floating hearts before they disappear!</p>

      <div class="score-board" id="score">Hearts Popped: 0</div>

      <div class="game-area" id="game-area">
        <!-- Dynamic hearts generated by JS -->
      </div>

      <button class="btn" onclick="startGame()">Start Game 🎮</button>
    </div>
  </main>

  <script>
    let score = 0;
    let gameInterval;
    const area = document.getElementById('game-area');

    function spawnHeart() {
      const heart = document.createElement('div');
      heart.className = 'pop-heart';
      heart.textContent = ['💖', '💕', '💗', '🍵', '☕'][Math.floor(Math.random()*5)];

      const x = Math.random() * (area.clientWidth - 40);
      const y = Math.random() * (area.clientHeight - 40);
      heart.style.left = x + 'px';
      heart.style.top = y + 'px';

      heart.onclick = () => {
        score++;
        document.getElementById('score').textContent = `Hearts Popped: ${score}`;
        area.removeChild(heart);
      };

      area.appendChild(heart);

      setTimeout(() => {
        if (area.contains(heart)) {
          area.removeChild(heart);
        }
      }, 2000);
    }

    function startGame() {
      score = 0;
      document.getElementById('score').textContent = 'Hearts Popped: 0';
      area.innerHTML = '';
      clearInterval(gameInterval);
      gameInterval = setInterval(spawnHeart, 600);
      setTimeout(() => {
        clearInterval(gameInterval);
        alert(`Game Over! You popped ${score} hearts for Justine! 🎉`);
      }, 15000);
    }
  </script>
</body>
</html>
