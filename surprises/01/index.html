<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>I LOVE YOU in AR</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    #canvas-container {
      width: 100%;
      height: 250px;
      margin: 15px 0;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
    .ar-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #E85A71;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="ar-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
        Surprise #01 — Real Camera AR
      </div>
      <h1 class="title">I LOVE YOU</h1>
      <p class="subtitle">Experience floating 3D text in your real room with iPhone AR Quick Look!</p>

      <!-- Apple AR Quick Look link for iOS -->
      <div class="ar-button-container">
        <a rel="ar" href="../../assets/models/iloveyou.usdz" class="ar-quick-look-link">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2'><path d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'/></a%3E" width="20" height="20" alt="AR">
          <span>View "I LOVE YOU" in AR</span>
        </a>
      </div>

      <div id="canvas-container">
        <canvas id="ar-fallback-canvas"></canvas>
      </div>

      <p style="font-size: 0.85rem; color: var(--text-muted);">
        <strong>iPhone Users:</strong> Tap the button above to launch real camera Augmented Reality.<br>
        <strong>Web View:</strong> Interactive 3D preview above!
      </p>
    </div>
  </main>

  <script>
    // Canvas 3D interactive fallback
    const canvas = document.getElementById('ar-fallback-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    let angle = 0;
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.save();
      ctx.translate(cx, cy);

      // Floating 3D text effect
      const scale = 1 + Math.sin(angle * 2) * 0.05;
      ctx.scale(scale, scale);

      // Glow
      ctx.shadowColor = '#E85A71';
      ctx.shadowBlur = 20;

      ctx.font = `bold ${canvas.width * 0.1}px var(--font-family)`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Shadow layer
      ctx.fillStyle = '#A02D40';
      ctx.fillText('I LOVE YOU', Math.sin(angle) * 10, 5);

      // Main text layer
      ctx.fillStyle = '#FF6B81';
      ctx.fillText('I LOVE YOU', 0, 0);

      // Heart icon
      ctx.font = `${canvas.width * 0.12}px var(--font-family)`;
      ctx.fillText('💖', 0, -canvas.height * 0.25 + Math.sin(angle * 3) * 8);

      ctx.restore();

      angle += 0.03;
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
