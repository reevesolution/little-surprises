<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Love Time Machine · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#161b38,#34345d)}.card{max-width:440px;overflow:visible}.scene{margin:20px auto;padding:18px;border-radius:22px;min-height:170px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:white;padding:13px 20px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:5px}button:focus-visible,a:focus-visible{outline:3px solid #713ca0;outline-offset:3px}.message{font-size:1.15rem;line-height:1.6;font-weight:650;margin:18px 0;min-height:50px}.hint{font-size:.84rem;color:#68616c}.hidden{display:none!important}.card{background:#25294b;color:#fff}.title{color:#fff}.subtitle,.hint{color:#d8d9ef}.machine{background:#11182c;border:3px solid #8ed4f1;box-shadow:inset 0 0 30px #4274ba}.dial{font-size:4rem}.choices{display:flex;flex-wrap:wrap;justify-content:center}.action{background:#47699e}.message{color:#f8e7fc}.finale{color:#ffd37b;font-size:1.5rem}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #14</div><h1 class="title">The Love Time Machine</h1><p class="subtitle">If love could travel through time, here's where I'd go.</p><div class="scene machine"><div class="dial">🕰️✨</div><div class="choices"><button class="action" data-time="past">Past</button><button class="action" data-time="present">Present</button><button class="action" data-time="future">Future</button></div></div><p class="message" id="message" role="status" aria-live="polite">Choose a destination in time.</p><div class="finale hidden" id="finale">I'd choose you forever. ♾️❤️</div></section></main><script>const messages={"past":"If I could go back to the beginning, I'd still choose you. Every single time.","present":"Of all the places life could have taken me, I'm so glad it brought me here with you.","future":"I can't wait to see all the adventures we haven't had yet. ❤️"};const seen=new Set();document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.time;seen.add(key);document.querySelector('#message').textContent=messages[key];if(seen.size===3)document.querySelector('#finale').classList.remove('hidden')}));</script></body></html>
