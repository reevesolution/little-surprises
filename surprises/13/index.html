<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hug Delivery Service · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#e5f5ff,#fbe5f4)}.card{max-width:440px;overflow:visible}.scene{margin:20px auto;padding:18px;border-radius:22px;min-height:170px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:white;padding:13px 20px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:5px}button:focus-visible,a:focus-visible{outline:3px solid #713ca0;outline-offset:3px}.message{font-size:1.15rem;line-height:1.6;font-weight:650;margin:18px 0;min-height:50px}.hint{font-size:.84rem;color:#68616c}.hidden{display:none!important}.sky{height:240px;background:linear-gradient(#80c7f2,#e7f9ff);position:relative;overflow:hidden}.package{font-size:5rem;display:block;transform:translateY(-150px);transition:transform 2s ease-in-out}.package.landed{transform:translateY(50px)}.coupon{border:3px dashed #e29ab3;background:#fff5e8;padding:20px;border-radius:12px}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #13</div><h1 class="title">Hug Delivery Service</h1><p class="subtitle">Incoming special delivery. A little something from your husband.</p><div class="scene sky"><div class="package" id="package">🪂📦</div></div><button class="action" id="deliver">Deliver my hug 📦</button><div id="coupon" class="coupon hidden" role="status" aria-live="polite"><div style="font-size:4rem">💝</div><p class="message">Redeemable for one real hug from your husband. No expiration date. Unlimited renewals. ❤️</p></div></section></main><script>let busy=false;document.querySelector('#deliver').addEventListener('click',()=>{if(busy)return;busy=true;const p=document.querySelector('#package');p.textContent='🪂📦';p.classList.remove('landed');void p.offsetWidth;p.classList.add('landed');document.querySelector('#coupon').classList.add('hidden');setTimeout(()=>{p.textContent='💖';document.querySelector('#coupon').classList.remove('hidden');document.querySelector('#deliver').textContent='Send another hug';busy=false},2050)});</script></body></html>
