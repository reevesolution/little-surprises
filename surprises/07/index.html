<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Written in the Stars · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:radial-gradient(circle at top,#24133c,#070d27);}.card{max-width:440px;overflow:visible}.scene{margin:22px auto;padding:18px;border-radius:22px;min-height:160px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:#fff;padding:13px 19px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:6px}.action:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #643b8b;outline-offset:3px}.message{margin:18px 0;font-size:1.13rem;line-height:1.55;font-weight:600;min-height:54px}.hint{font-size:.84rem;color:#6c6470}.hidden{display:none!important}.card{background:#110f2e;color:white}.title{color:#fff}.subtitle,.hint{color:#d4c7f1}.sky{height:290px;position:relative;background:radial-gradient(ellipse,#32205b,#0a0e26);overflow:hidden}.star{position:absolute;background:transparent;border:0;color:#fff9ad;font-size:2.5rem;cursor:pointer;filter:drop-shadow(0 0 8px #ffeaaa);animation:twinkle 2s infinite alternate}.star.done{color:#ff9ad4}.constellation{position:absolute;inset:20%;display:grid;place-items:center;font-size:5rem;opacity:0;transition:opacity 1s;pointer-events:none}.constellation.visible{opacity:1}@keyframes twinkle{to{filter:drop-shadow(0 0 18px #fff)}}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #07</div><h1 class="title">Written in the Stars</h1><p class="subtitle">Tap all five stars. I left a little message in each one.</p><div class="scene sky" id="sky"><div class="constellation" id="heart" aria-hidden="true">💖</div></div><p class="message" id="message" role="status" aria-live="polite">The universe has a few things to tell you…</p></section></main><script>const notes=["You're my favorite person.","I'd choose you all over again.","You make ordinary days special.","I love the life we're building.","You're my forever favorite. ❤️"];const positions=[[10,15],[67,12],[37,43],[77,68],[12,73]];const seen=new Set();positions.forEach(([x,y],i)=>{const b=document.createElement('button');b.className='star';b.textContent='✦';b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label','Read star '+(i+1));b.addEventListener('click',()=>{seen.add(i);b.classList.add('done');document.querySelector('#message').textContent=notes[i];if(seen.size===5)document.querySelector('#heart').classList.add('visible')});document.querySelector('#sky').appendChild(b)});</script></body></html>
