<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Kissing Booth · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#ffe7ee,#fff3dd)}.card{max-width:440px;overflow:visible}.scene{margin:20px auto;padding:18px;border-radius:22px;min-height:180px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:white;padding:13px 20px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:5px}button:focus-visible{outline:3px solid #713ca0;outline-offset:3px}.message{font-size:1.12rem;line-height:1.55;font-weight:650;margin:18px 0;min-height:50px}.hint{font-size:.84rem;color:#68616c}.hidden{display:none!important}.booth{background:repeating-linear-gradient(90deg,#f8b3c4 0 28px,#fff5df 28px 56px);border:5px solid #b93e62;box-shadow:0 7px 0 #8b2e49}.sign{background:#fff5df;border:3px solid #b93e62;padding:8px;border-radius:12px;font-weight:900;letter-spacing:.08em}.bell{font-size:5rem;background:transparent;border:0;cursor:pointer}.ticket{background:#fff8ea;border:2px dashed #b93e62;border-radius:12px;padding:15px}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #19</div><h1 class="title">The Kissing Booth</h1><p class="subtitle">Step right up! Every prize is a winner. Ring the bell!</p><div class="scene booth"><div class="sign">💋 THE KISSING BOOTH 💋</div><button class="bell" id="bell" aria-label="Ring the kissing booth bell">🛎️</button><div id="ticket" class="ticket hidden" role="status" aria-live="polite"><h2 id="prize"></h2><p id="details"></p></div></div><p class="hint">Valid for the rest of forever. ❤️</p></section></main><script>const prizes=[["10 Forehead Kisses","Redeemable whenever you need a little extra love. ❤️"],["25 Surprise Kisses","Your husband must deliver them when you least expect it. 💋"],["Unlimited Goodnight Kisses","Valid for the rest of forever. 🌙"],["One Ridiculously Long Hug + Kiss","No rushing allowed. ❤️"]];let index=-1;document.querySelector('#bell').addEventListener('click',()=>{index=(index+1)%prizes.length;document.querySelector('#prize').textContent=prizes[index][0];document.querySelector('#details').textContent=prizes[index][1];document.querySelector('#ticket').classList.remove('hidden');if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelector('#bell').animate([{transform:'rotate(-12deg)'},{transform:'rotate(12deg)'},{transform:'rotate(0)'}],{duration:400})}});</script></body></html>
