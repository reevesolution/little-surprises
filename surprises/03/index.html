<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A Little Love Letter · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#fff3f7,#f5ecff)}.card{max-width:440px}.stage{margin:22px 0}.action{border:0;border-radius:24px;background:#c43b71;color:white;padding:14px 22px;font-size:1rem;font-weight:700;cursor:pointer;min-height:48px}button:focus-visible{outline:3px solid #43216a;outline-offset:3px}.result{font-size:1.15rem;font-weight:650;line-height:1.6;min-height:65px;margin:18px 0}.hint{font-size:.85rem;color:#5c5361}.card{overflow:visible}.envelope{position:relative;display:grid;place-items:center;height:210px;margin:35px auto 18px;max-width:330px;background:#e89ab6;border-radius:8px;box-shadow:0 12px 30px #e89ab655;overflow:visible}.envelope:after{content:'💌';font-size:4rem;position:absolute;bottom:22px}.letter{position:absolute;top:24px;left:5%;width:90%;min-height:170px;padding:20px 14px;background:#fffaf4;border-radius:8px;box-shadow:0 3px 12px #0002;transform:translateY(20px) scale(.87);transition:transform .8s ease;z-index:2;opacity:0;pointer-events:none}.opened .letter{transform:translateY(-72px) scale(1);opacity:1}.opened.envelope:after{opacity:.3}.letter p{font-family:Georgia,serif;font-size:1.05rem;line-height:1.5}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #03</div><h1 class="title">A Little Love Letter</h1><p class="subtitle">A tiny note, just for you.</p><div class="envelope stage" id="envelope"><div class="letter" id="letter"><p>Just a little reminder that loving you is my favorite part of every day. ❤️</p></div></div><button class="action" id="open" aria-expanded="false" aria-controls="letter">Open your letter 💌</button><p class="hint" id="status" aria-live="polite"></p></section></main><script>const b=document.querySelector('#open'),env=document.querySelector('#envelope');b.addEventListener('click',()=>{env.classList.toggle('opened');const open=env.classList.contains('opened');b.textContent=open?'Close letter 💌':'Open your letter 💌';b.setAttribute('aria-expanded',String(open));document.querySelector('#status').textContent=open?'❤️ ❤️ ❤️':''})</script></body></html>
