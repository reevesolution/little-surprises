<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Tiny Jukebox · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#f8e9d7,#e5c8ae)}.card{max-width:440px;overflow:visible}.scene{margin:20px auto;padding:18px;border-radius:22px;min-height:170px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:white;padding:13px 20px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:5px}button:focus-visible,a:focus-visible{outline:3px solid #713ca0;outline-offset:3px}.message{font-size:1.15rem;line-height:1.6;font-weight:650;margin:18px 0;min-height:50px}.hint{font-size:.84rem;color:#68616c}.hidden{display:none!important}.jukebox{background:linear-gradient(120deg,#6a302f,#b15c47,#572a37);border:8px solid #d8ae63;box-shadow:inset 0 0 0 4px #f8db9e;color:#fff}.record{width:170px;height:170px;margin:10px auto;border-radius:50%;background:repeating-radial-gradient(circle,#151515 0 4px,#333 5px 7px);display:grid;place-items:center;box-shadow:0 4px 20px #0007}.record:before{content:'❤️';display:grid;place-items:center;background:#d16b72;width:55px;height:55px;border-radius:50%}.spinning{animation:spin 2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.player{aspect-ratio:16/9;width:100%;border:0;border-radius:10px;background:#1b1b1b}.link{display:block;color:#ffecb5;margin-top:10px}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #12</div><h1 class="title">The Tiny Jukebox</h1><p class="subtitle">One song. One very special person. ❤️</p><div class="scene jukebox"><div class="record" id="record" aria-label="Vintage vinyl record"></div><p>Blake Shelton</p><strong>I'll Name the Dogs</strong><div id="player" class="hidden"></div><button class="action" id="play">Play our song ▶</button><a class="link" href="https://www.youtube.com/watch?v=FR-FoZzp0D8" target="_blank" rel="noopener noreferrer">Open official audio on YouTube</a></div><p class="hint">The music starts only when you tap. If the embedded video isn't available, use the YouTube link.</p></section></main><script>const play=document.querySelector('#play');play.addEventListener('click',()=>{const box=document.querySelector('#player');if(box.classList.contains('hidden')){box.classList.remove('hidden');const iframe=document.createElement('iframe');iframe.className='player';iframe.title="Blake Shelton — I'll Name the Dogs";iframe.allow='autoplay; encrypted-media; picture-in-picture';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.src='https://www.youtube-nocookie.com/embed/FR-FoZzp0D8?autoplay=1';box.appendChild(iframe);document.querySelector('#record').classList.add('spinning');play.textContent='Stop song ■'}else{box.replaceChildren();box.classList.add('hidden');document.querySelector('#record').classList.remove('spinning');play.textContent='Play our song ▶'}});</script></body></html>
