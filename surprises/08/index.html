<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Professor Husband's Love Potion Lab · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#140c26,#34234b);}.card{max-width:440px;overflow:visible}.scene{margin:22px auto;padding:18px;border-radius:22px;min-height:160px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:#fff;padding:13px 19px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:6px}.action:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #643b8b;outline-offset:3px}.message{margin:18px 0;font-size:1.13rem;line-height:1.55;font-weight:600;min-height:54px}.hint{font-size:.84rem;color:#6c6470}.hidden{display:none!important}.card{background:#251d36;color:#e9ffe4}.title{color:#e9ffe4}.subtitle,.hint{color:#d4d4dc}.lab{background:radial-gradient(circle,#305a4c,#141c26);border:2px solid #91e0ad}.flask{font-size:5rem;animation:bubble 2s infinite alternate}@keyframes bubble{to{transform:translateY(-8px)}}.ingredients{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ingredient{border:1px solid #87b98d;background:#302c45;color:#fff;border-radius:13px;padding:12px 4px;cursor:pointer}.ingredient.selected{background:#537f65;border-color:#d8ff9a}.message strong{color:#d8ff9a}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #08</div><h1 class="title">Professor Husband's Love Potion Lab</h1><p class="subtitle">Select exactly two ingredients, then let science do something ridiculous.</p><div class="scene lab"><div class="flask" id="flask">⚗️🫧</div><div class="ingredients" id="ingredients"></div></div><button class="action" id="mix" disabled>Mix my love potion ✨</button><div class="message" id="result" role="status" aria-live="polite"></div><p class="hint">Professor Husband's conclusion: You are my favorite discovery. ❤️</p></section></main><script>const ingredients=["Stolen Kiss","Bear Hug","Giggle Dust","Morning Coffee","Stardust","Pure Love"];const potions=[["The Smoochinator 3000","Side effects include spontaneous kissing and an inability to stop smiling."],["Maximum Cuddle Concentrate","One dose guarantees a lifetime supply of husband hugs."],["Ridiculous Romance Serum","Warning: May cause excessive flirting from your husband."],["The Giggle Elixir","Scientifically formulated to make ordinary days a little more fun."],["Forever & Always Formula","Rare discovery! Two hearts, one beautiful life together. ❤️"],["Morning Magic Potion","Contains equal parts caffeine, affection, and a husband who adores you."],["Anti-Bad-Day Brew","For difficult days. Administer one hug, followed by as many kisses as necessary."],["The Justine Effect","Extremely powerful. Makes one particular husband fall more in love every single day. ❤️"]];const selected=new Set();const mix=document.querySelector('#mix');ingredients.forEach((name,i)=>{const b=document.createElement('button');b.className='ingredient';b.textContent=name;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{if(selected.has(i))selected.delete(i);else if(selected.size<2)selected.add(i);b.classList.toggle('selected',selected.has(i));b.setAttribute('aria-pressed',String(selected.has(i)));mix.disabled=selected.size!==2});document.querySelector('#ingredients').appendChild(b)});mix.addEventListener('click',()=>{const potion=potions[Math.floor(Math.random()*potions.length)];document.querySelector('#flask').textContent='🧪💚✨';const out=document.querySelector('#result');out.textContent=potion[0]+' — '+potion[1]});</script></body></html>
