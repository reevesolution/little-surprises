<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Emergency Love Button · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#fff3f7,#f5ecff)}.card{max-width:440px}.stage{margin:22px 0}.action{border:0;border-radius:24px;background:#c43b71;color:white;padding:14px 22px;font-size:1rem;font-weight:700;cursor:pointer;min-height:48px}button:focus-visible{outline:3px solid #43216a;outline-offset:3px}.result{font-size:1.15rem;font-weight:650;line-height:1.6;min-height:65px;margin:18px 0}.hint{font-size:.85rem;color:#5c5361}.emergency{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#ff7182,#bb0e3e 65%);color:white;border:10px solid #ffe1e8;box-shadow:0 12px 0 #8e1235,0 20px 25px #0003;font-size:1.5rem;font-weight:900;cursor:pointer;transition:transform .15s}.emergency:active{transform:translateY(8px);box-shadow:0 4px 0 #8e1235}.burst{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.08)}}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #04</div><h1 class="title">Emergency Love Button</h1><p class="subtitle">For any moment when you need a little extra husband love.</p><div class="stage"><button class="emergency" id="button">PRESS FOR<br>LOVE ❤️</button></div><div class="result" id="result" role="status" aria-live="polite">Your emergency supply is ready.</div><p class="hint">Unlimited presses. Unlimited love.</p></section></main><script>const messages=["Emergency alert: Your husband thinks you're ridiculously beautiful. ❤️","In case you forgot: I would choose you again in every lifetime.","WARNING: You are dangerously close to receiving unsolicited kisses.","Official husband announcement: You're my favorite human. Don't tell the others.","You've reached the husband support hotline. Press 1 for kisses. Press 2 for more kisses.","Breaking news: Local woman continues to be adored by suspiciously handsome husband.","Whatever kind of day you're having, I'm always on your team. ❤️","Your emergency supply of love has been replenished. Inventory: INFINITE.","Scientists have confirmed that your smile is my favorite thing.","This button has no actual emergency function. I just wanted another excuse to tell you I love you.","Husband.exe has encountered an error: Cannot stop thinking about wife.","If today feels heavy, remember you never have to carry it all alone. I love you. ❤️"];let last=-1;const b=document.querySelector('#button');b.addEventListener('click',()=>{let i;if(last<0){i=Math.floor(Math.random()*messages.length)}else{i=Math.floor(Math.random()*(messages.length-1));if(i>=last)i++}last=i;document.querySelector('#result').textContent=messages[i];b.classList.remove('burst');void b.offsetWidth;b.classList.add('burst')});</script></body></html>
