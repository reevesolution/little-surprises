<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Love Letter Scratch Card</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    .scratch-container {
      position: relative;
      width: 100%;
      max-width: 340px;
      height: 220px;
      margin: 20px auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .scratch-reveal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #FFF0F3, #FFE3E8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .reveal-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-hover);
      line-height: 1.5;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="badge">Surprise #04</div>
      <h1 class="title">Love Letter</h1>
      <p class="subtitle">Use your finger or mouse to scratch off the foil and reveal your secret note!</p>

      <div class="scratch-container">
        <div class="scratch-reveal">
          <div style="font-size: 2.5rem; margin-bottom: 8px;">💌</div>
          <div class="reveal-text">
            "Justine, you make every ordinary day feel like magic. Thank you for being my favorite part of every day!"
          </div>
        </div>
        <canvas id="scratch-canvas"></canvas>
      </div>

      <button class="btn" style="margin-top: 10px;" onclick="resetScratch()">Scratch Again 💫</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');

    function init() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      // Scratch overlay
      ctx.fillStyle = '#C0C0C0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gold pattern overlay
      ctx.fillStyle = '#D4AF37';
      ctx.font = 'bold 18px var(--font-family)';
      ctx.textAlign = 'center';
      ctx.fillText('✨ SCRATCH HERE ✨', canvas.width / 2, canvas.height / 2);
    }

    let isScratching = false;

    function scratch(e) {
      if (!isScratching) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 25, 0, Math.PI * 2);
      ctx.fill();
    }

    canvas.addEventListener('mousedown', (e) => { isScratching = true; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    window.addEventListener('mouseup', () => isScratching = false);

    canvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); });
    canvas.addEventListener('touchmove', scratch);
    window.addEventListener('touchend', () => isScratching = false);

    function resetScratch() {
      ctx.globalCompositeOperation = 'source-over';
      init();
    }

    init();
  </script>
</body>
</html>
