<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Love Quote Slot Machine</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    .slot-machine {
      display: flex;
      justify-content: center;
      gap: 10px;
      background: #1E293B;
      padding: 20px;
      border-radius: 16px;
      margin: 20px 0;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
    }
    .slot-reel {
      width: 65px;
      height: 75px;
      background: #FFFFFF;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .quote-box {
      min-height: 60px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary-hover);
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="badge">Surprise #15</div>
      <h1 class="title">Love Slot Machine</h1>
      <p class="subtitle">Spin the reels for a guaranteed winning romantic combination!</p>

      <div class="slot-machine">
        <div class="slot-reel" id="r1">🍵</div>
        <div class="slot-reel" id="r2">❤️</div>
        <div class="slot-reel" id="r3">☕</div>
      </div>

      <button class="btn" onclick="spinSlots()">Spin Machine 🎰</button>

      <div class="quote-box" id="quote">
        Spin to reveal your lucky daily quote!
      </div>
    </div>
  </main>

  <script>
    const symbols = ['🍵', '☕', '💖', '👑', '🌸', '✨'];
    const quotes = [
      "JACKPOT! You matched Tea + Love + Coffee — The ultimate power couple!",
      "WINNER! Justine gets unlimited warmth, hugs, and favorite tea today!",
      "TRIPLE MATCH! 'Love isn't finding someone to live with; it's finding someone you can't live without.'"
    ];

    function spinSlots() {
      let interval = setInterval(() => {
        document.getElementById('r1').textContent = symbols[Math.floor(Math.random()*symbols.length)];
        document.getElementById('r2').textContent = symbols[Math.floor(Math.random()*symbols.length)];
        document.getElementById('r3').textContent = symbols[Math.floor(Math.random()*symbols.length)];
      }, 100);

      setTimeout(() => {
        clearInterval(interval);
        document.getElementById('r1').textContent = '🍵';
        document.getElementById('r2').textContent = '💖';
        document.getElementById('r3').textContent = '☕';
        document.getElementById('quote').textContent = quotes[Math.floor(Math.random()*quotes.length)];
      }, 1000);
    }
  </script>
</body>
</html>
