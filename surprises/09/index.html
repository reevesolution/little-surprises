<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Love Fortune Cookie · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#fff7e5,#ffe9c7);}.card{max-width:440px;overflow:visible}.scene{margin:22px auto;padding:18px;border-radius:22px;min-height:160px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:#fff;padding:13px 19px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:6px}.action:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #643b8b;outline-offset:3px}.message{margin:18px 0;font-size:1.13rem;line-height:1.55;font-weight:600;min-height:54px}.hint{font-size:.84rem;color:#6c6470}.hidden{display:none!important}.cookie{border:0;background:transparent;font-size:7rem;cursor:pointer;transition:transform .5s}.cookie.cracked{transform:rotate(-17deg) scale(1.14)}.fortune{background:#fff9d7;border:2px dashed #c18a42;border-radius:12px;padding:22px;min-height:100px}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #09</div><h1 class="title">Love Fortune Cookie</h1><p class="subtitle">A little fortune, baked with love. Tap the cookie!</p><div class="scene"><button class="cookie" id="cookie" aria-label="Crack fortune cookie">🥠</button></div><div class="message fortune" id="fortune" role="status" aria-live="polite">Your fortune awaits…</div><button class="action" id="again">Another fortune</button></section></main><script>const fortunes=["A handsome husband is thinking about you. (It's me. Obviously.)","Your future contains an unreasonable number of kisses.","Someone loves you more than coffee. And that's saying something.","A surprise hug is heading your way.","Your lucky number is 2. Because you and me. ❤️"];let last=-1;function crack(){let n=last<0?Math.floor(Math.random()*fortunes.length):Math.floor(Math.random()*(fortunes.length-1));if(last>=0&&n>=last)n++;last=n;document.querySelector('#fortune').textContent=fortunes[n];const b=document.querySelector('#cookie');b.classList.remove('cracked');void b.offsetWidth;b.classList.add('cracked')}document.querySelector('#cookie').addEventListener('click',crack);document.querySelector('#again').addEventListener('click',crack);</script></body></html>
