<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Case File: Stolen Heart · Little Surprises</title><link rel="stylesheet" href="../../assets/css/style.css"><style>body{background:linear-gradient(145deg,#d7d1c4,#afa699)}.card{max-width:440px;overflow:visible}.scene{margin:20px auto;padding:18px;border-radius:22px;min-height:180px}.action{display:inline-block;border:0;border-radius:24px;background:#bc3875;color:white;padding:13px 20px;min-height:46px;font-size:1rem;font-weight:700;cursor:pointer;margin:5px}button:focus-visible{outline:3px solid #713ca0;outline-offset:3px}.message{font-size:1.12rem;line-height:1.55;font-weight:650;margin:18px 0;min-height:50px}.hint{font-size:.84rem;color:#68616c}.hidden{display:none!important}.case{background:#f2e8cc;border:3px double #514b42;box-shadow:5px 6px 0 #776d60}.evidence{display:grid;gap:8px}.evidence button{background:#ddd0af;border:1px solid #73654c;border-radius:6px;padding:14px;text-align:left;font:700 1rem Georgia,serif;cursor:pointer}.stamp{font:900 1.3rem Georgia,serif;color:#ad2835;transform:rotate(-4deg);border:3px solid #ad2835;padding:10px}</style></head><body><main class="container"><section class="card"><div class="badge">Little Surprise #17</div><h1 class="title">Case File: Stolen Heart</h1><p class="subtitle">Detective Division — Case #LOVE-001. Three exhibits. One obvious suspect.</p><div class="scene case"><p>CONFIDENTIAL — EVIDENCE FILE</p><div class="evidence" id="evidence"></div><p class="message" id="message" role="status" aria-live="polite">Tap each exhibit to investigate.</p><div class="stamp hidden" id="verdict">GUILTY OF BEING LOVED</div></div><p class="message hidden" id="sentence">Sentence: A lifetime of kisses, hugs, and being stuck with me. ❤️</p></section></main><script>const exhibits=[["Exhibit A — Last known location","The missing heart was last seen in the immediate vicinity of Justine."],["Exhibit B — Witness statement","The husband admits he gave it away willingly and has absolutely no intention of getting it back."],["Exhibit C — Motive","Investigators uncovered overwhelming evidence of affection, laughter, and a lifetime of love."]];const seen=new Set();exhibits.forEach(([name,note],i)=>{const b=document.createElement('button');b.textContent='📁 '+name;b.addEventListener('click',()=>{seen.add(i);b.textContent='✓ '+name;document.querySelector('#message').textContent=note;if(seen.size===3){document.querySelector('#verdict').classList.remove('hidden');document.querySelector('#sentence').classList.remove('hidden')}});document.querySelector('#evidence').appendChild(b)});</script></body></html>
