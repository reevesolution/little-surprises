name: Little Surprises pre-Antigravity checks
on:
  push:
    branches: [skippy/approved-surprises-rebuild]
  pull_request:
    paths: ['surprises/**', 'scripts/**', 'surprises.json', '.github/workflows/little-surprises-qc.yml']
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Locked content checks
        run: python -m unittest discover -s scripts -p 'test_approved_content.py' -v
      - name: Batch 1 acceptance checks
        run: python -m unittest discover -s scripts -p 'test_batch_one.py' -v
      - name: JavaScript syntax checks for 20 pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for page in sorted(Path("surprises").glob("*/index.html")):
              html = page.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
              for index, script in enumerate(scripts):
                  target = Path("/tmp") / f"little-surprises-{page.parent.name}-{index}.js"
                  target.write_text(script, encoding="utf-8")
          PY
          for script in /tmp/little-surprises-*.js; do node --check "$script"; done
